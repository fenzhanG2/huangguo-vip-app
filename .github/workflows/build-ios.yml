name: Build iOS IPA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Regression tests
        run: flutter test
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qry huangguo-vip-unsigned.ipa Payload
          ls -lh huangguo-vip-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: huangguo-vip-ipa
          path: build/ios/iphoneos/huangguo-vip-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
